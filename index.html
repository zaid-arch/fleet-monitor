<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Monitor</title>

  <!--
    Fleet Monitor — office floor
    ----------------------------
    Single-file dashboard in live mode: it reads status.json next to
    this page every 3 seconds. office.jpg is the office scene; each
    bot's live status chip sits over its monitor.

    Weekly usage is read from status.json too, as a top-level object:
    "usage": { "weekUsedPct": 24.9, "snapshotAt": ISO, "resetsAt": ISO,
               "shares": [ { "id": "donna", "pct": 81 }, ... ] }
    pct may be a number or a string such as "<1". The panel hides when
    usage is missing.

    Expected status.json shape:

    {
      "updatedAt": "2026-11-15T15:00:00.000Z",
      "messagesLastMinute": 7,
      "bots": [
        {
          "id": "donna",
          "name": "DONNA",
          "role": "Manager / coordinator",
          "status": "idle",
          "currentTask": "Reviewing assignments",
          "avatar": "",
          "tasksCompletedToday": 11,
          "openTasks": 4,
          "errorCount": 0,
          "alerts": [
            { "at": "2026-11-15T14:10:00.000Z", "text": "Optional alert text" }
          ],
          "uptimeSince": "2026-11-15T08:12:00.000Z",
          "stateSince": "2026-11-15T14:40:00.000Z",
          "msgsToday": { "sent": 28, "received": 31 },
          "lastHandoff": {
            "with": "milo",
            "direction": "to",
            "at": "2026-11-15T14:51:00.000Z",
            "label": "task brief"
          },
          "activityHistory": [2, 1, 0, 3, 4, 6, 5, 8, 7, 6, 4, 5],
          "activity": [
            { "at": "2026-11-15T14:51:00.000Z", "text": "Assigned a brief to MILO" }
          ]
        }
      ],
      "handoffs": [
        { "from": "donna", "to": "milo", "label": "Task brief" }
      ]
    }

    status must be one of: "idle" | "busy" | "error"
    avatar is an optional image URL; when missing or if the image fails,
    the built-in SVG portrait is used. The URL must not be required for
    the page to work offline.
    activityHistory is 12 numbers, oldest first, one bucket per hour.
    handoffs are consumed once, to spawn a travelling particle.
    activity timestamps should be ISO-8601.
    Bot ids used in this file: donna, milo, colin, alex, audrey,
    security, legal, mailman, morgan, research.
  -->
  <style>
    :root {
      --text: #f4ead9;
      --muted: #c9b597;
      --faint: #94806a;
      --panel: rgba(38, 24, 15, 0.66);
      --panel-strong: rgba(30, 19, 12, 0.86);
      --brass: rgba(214, 170, 98, 0.38);
      --brass-strong: rgba(226, 184, 110, 0.7);
      --gold: #e2b86e;
      --idle: #5fd68f;
      --busy: #f6b53f;
      --error: #f0675f;
      --sans: "Segoe UI", "Avenir Next", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      --mono: "SF Mono", "Cascadia Mono", "Consolas", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      min-height: 100%;
      background: radial-gradient(ellipse 110% 80% at 50% 0%, #3a2414 0%, #22150c 55%, #170e08 100%) fixed;
      background-color: #170e08;
    }
    body { min-height: 100vh; color: var(--text); font-family: var(--sans); color-scheme: dark; background: transparent; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .glass {
      background: var(--panel);
      border: 1px solid var(--brass);
      backdrop-filter: blur(10px) saturate(1.1);
      -webkit-backdrop-filter: blur(10px) saturate(1.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 220, 160, 0.08);
    }

    /* Top bar */
    header {
      position: sticky; top: 0; z-index: 5;
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px 24px;
      padding: 14px 28px;
      background: rgba(28, 17, 10, 0.82);
      border-bottom: 1px solid var(--brass);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand strong { font-size: 16px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
    .live {
      display: none; align-items: center; gap: 6px;
      padding: 2px 8px; border-radius: 999px;
      border: 1px solid rgba(95, 214, 143, 0.45); background: rgba(95, 214, 143, 0.12);
      color: var(--idle); font: 700 12px var(--sans); letter-spacing: 0.1em; text-transform: uppercase;
    }
    body.is-live .live { display: inline-flex; }
    .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); box-shadow: 0 0 8px var(--idle); animation: pulse 2s infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    .counts { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-left: auto; font-size: 15px; color: var(--muted); }
    .counts span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .counts b { color: var(--text); font-weight: 700; font-size: 17px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .dot.idle { background: var(--idle); } .dot.busy { background: var(--busy); } .dot.error { background: var(--error); }
    .clock { font-size: 14px; color: var(--muted); white-space: nowrap; }
    .clock small { color: var(--faint); margin-left: 4px; }

    main { padding: 22px 28px 36px; max-width: 1500px; margin: 0 auto; }

    /* Weekly usage: one compact line */
    .usage {
      display: flex; align-items: center; flex-wrap: wrap; gap: 10px 22px;
      padding: 16px 22px; border-radius: 14px; margin: 0 auto 22px; max-width: 1240px; font-size: 15px; color: var(--muted);
    }
    .usage .lead { color: var(--text); white-space: nowrap; font-size: 16px; }
    .usage .lead b { color: var(--gold); font-size: 18px; }
    .ubar { width: 110px; height: 7px; border-radius: 3px; background: rgba(255, 230, 190, 0.12); overflow: hidden; }
    .ubar i { display: block; height: 100%; background: linear-gradient(90deg, #c9934a, var(--gold)); }
    .usage ol { display: flex; flex-wrap: wrap; gap: 6px 18px; list-style: none; }
    .usage li b { color: var(--text); font-weight: 700; margin-left: 5px; }
    .usage .meta { margin-left: auto; color: var(--muted); font-size: 14px; }

    /* Office scene: Alex's render, shown once, with live chips over each monitor */
    .scene {
      position: relative; width: 100%; max-width: 1240px; margin: 0 auto 22px;
      aspect-ratio: 1280 / 600; border-radius: 16px; overflow: hidden;
      border: 1px solid var(--brass); box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      container-type: inline-size;
    }
    .scene img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .desk { position: absolute; transform: translate(-50%, 0); background: none; border: 0; border-radius: 10px; cursor: pointer; }
    .desk:hover, .desk:focus-visible, .desk.is-open { outline: 2px solid var(--brass-strong); outline-offset: -2px; background: rgba(226, 184, 110, 0.08); }
    .mon {
      position: absolute; transform: translate(-50%, -50%);
      width: 5.9%; height: 5.4%;
      display: flex; align-items: center; justify-content: center; gap: 0.4cqw;
      border-radius: 0.35cqw; border: 1px solid currentColor; cursor: pointer;
      background: rgb(14, 12, 10); overflow: hidden; white-space: nowrap; padding: 0;
      font: 700 clamp(5px, 1.15cqw, 15px) var(--mono); letter-spacing: 0.04em; text-transform: uppercase;
      box-shadow: 0 0 1.2cqw currentColor; z-index: 2;
    }
    .mon i { width: 0.55cqw; height: 0.55cqw; min-width: 3px; min-height: 3px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .mon.idle { color: var(--idle); } .mon.busy { color: var(--busy); } .mon.error { color: var(--error); }
    .mon.is-open { outline: 2px solid var(--gold); outline-offset: 2px; }

    /* Cards */
    #floor { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; position: relative; max-width: 1240px; margin: 0 auto; }
    #handoff-layer { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
    .particle { fill: var(--gold); } .particle-glow { fill: rgba(226, 184, 110, 0.3); }
    .card {
      position: relative; border-radius: 14px; padding: 20px 22px; cursor: pointer;
      border-left: 3px solid var(--idle); transition: border-color .2s, transform .15s;
    }
    .card:hover, .card:focus-visible { border-color: var(--brass-strong); outline: none; transform: translateY(-1px); }
    .card.is-idle { border-left-color: var(--idle); }
    .card.is-busy { border-left-color: var(--busy); }
    .card.is-error { border-left-color: var(--error); box-shadow: 0 0 0 1px rgba(240, 103, 95, 0.35), 0 10px 30px rgba(0,0,0,.35); }
    .card.is-open { border-color: var(--gold); }
    .top { display: flex; align-items: center; gap: 14px; }
    .portrait { width: 54px; height: 54px; border-radius: 50%; flex-shrink: 0; overflow: hidden; border: 2px solid var(--brass-strong); background: rgba(0,0,0,.25); }
    .portrait svg, .portrait img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .iden { min-width: 0; flex: 1; }
    .iden h3 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
    .iden p { margin-top: 3px; font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pill {
      display: inline-flex; align-items: center; gap: 6px; flex-shrink: 0;
      padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; text-transform: capitalize;
      border: 1px solid currentColor; background: rgba(0, 0, 0, 0.25);
    }
    .pill.idle { color: var(--idle); } .pill.busy { color: var(--busy); } .pill.error { color: var(--error); }
    .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .task { margin-top: 16px; font-size: 15px; color: var(--text); line-height: 1.35; }
    .task:empty { display: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 20px; margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(214, 170, 98, 0.18); }
    .grid div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .grid dt { font-size: 14px; color: var(--muted); }
    .grid dd { font-size: 20px; font-weight: 700; color: var(--text); white-space: nowrap; }
    .grid dd small { font-size: 14px; font-weight: 400; color: var(--muted); }
    .extra { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; font-size: 14px; color: var(--muted); }
    .extra:empty { display: none; }
    .extra p { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
    .extra p span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .extra .ico { color: var(--gold); flex-shrink: 0; }
    .extra .alert { color: var(--error); }
    .usage[hidden] { display: none; }
    .extra .alert .ico { color: var(--error); }
    .extra em { font-style: normal; color: var(--faint); flex-shrink: 0; }

    /* Detail panel */
    #panel {
      position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100vw); z-index: 8;
      background: var(--panel-strong); border-left: 1px solid var(--brass-strong);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      transform: translateX(105%); transition: transform .25s ease; overflow-y: auto; padding: 24px;
    }
    #panel.open { transform: none; }
    .panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
    .panel-head .portrait { width: 52px; height: 52px; }
    .panel-head h2 { font-size: 20px; }
    .panel-head p { font-size: 15px; color: var(--muted); }
    .close { margin-left: auto; background: none; border: 1px solid var(--brass); color: var(--text); width: 30px; height: 30px; border-radius: 8px; font-size: 18px; cursor: pointer; }
    .block-label { display: block; margin: 20px 0 8px; font-size: 14px; font-weight: 600; color: var(--gold); }
    .pstat { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid rgba(214, 170, 98, 0.18); font-size: 15px; color: var(--muted); }
    .pstat b { font-size: 18px; color: var(--text); }
    #p-spark { width: 100%; height: 48px; display: block; }
    .list { list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 14px; }
    .list li { display: flex; gap: 10px; }
    .list time { color: var(--muted); flex-shrink: 0; min-width: 64px; }
    .list.alerts span { color: var(--error); }

    @media (max-width: 720px) {
      header { padding: 12px 16px; }
      .counts { margin-left: 0; width: 100%; order: 3; }
      .clock { margin-left: auto; }
      .clock small { display: none; }
      main { padding: 16px; }
      .scene { border-radius: 10px; margin-bottom: 16px; }
      #floor { grid-template-columns: 1fr; }
      .usage .meta { margin-left: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .live i { animation: none; } }
  </style>
</head>

      function el(tag, cls, text) {
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      function relTime(iso) {
        const t = iso ? new Date(iso).getTime() : NaN;
        if (!isFinite(t)) return "";
        const ms = Date.now() - t;
        if (ms < 8000) return "just now";
        if (ms < 60000) return Math.round(ms / 1000) + "s ago";
        if (ms < 3600000) return Math.round(ms / 60000) + "m ago";
        if (ms < 86400000) return Math.round(ms / 3600000) + "h ago";
        return Math.round(ms / 86400000) + "d ago";
      }

      function durSince(iso) {
        const t = iso ? new Date(iso).getTime() : NaN;
        if (!isFinite(t)) return "";
        const ms = Math.max(0, Date.now() - t);
        if (ms < 60000) return Math.max(1, Math.round(ms / 1000)) + "s";
        if (ms < 3600000) return Math.round(ms / 60000) + "m";
        if (ms < 86400000) {
          const h = Math.floor(ms / 3600000);
          const m = Math.round((ms % 3600000) / 60000);
          return m ? h + "h " + m + "m" : h + "h";
        }
        return Math.round(ms / 86400000) + "d";
      }

      function svgUse(id) {
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 80 80");
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS(ns, "use");
        use.setAttribute("href", "#avatar-" + id);
        use.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#avatar-" + id);
        svg.appendChild(use);
        return svg;
      }

      function mountPortrait(container, person, live) {
        const url = (live && live.avatar) || "";
        if (container.dataset.avatarKey === url && container.childNodes.length) return;
        container.dataset.avatarKey = url;
        container.innerHTML = "";
        if (url) {
          const img = document.createElement("img");
          img.alt = "";
          img.src = url;
          img.addEventListener("error", function () {
            container.innerHTML = "";
            container.appendChild(svgUse(person.id));
          });
          container.appendChild(img);
        } else {
          container.appendChild(svgUse(person.id));
        }
      }

      function sparkSVG(values, w, h) {
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        svg.setAttribute("preserveAspectRatio", "none");
        svg.setAttribute("aria-hidden", "true");
        const data = (values && values.length ? values : [0, 0]).slice();
        const max = Math.max(1, ...data);
        const step = data.length > 1 ? (w - 2) / (data.length - 1) : w;
        const pts = data.map((v, i) => (1 + i * step).toFixed(1) + "," + (h - 2 - (v / max) * (h - 6)).toFixed(1)).join(" ");
        const poly = document.createElementNS(ns, "polyline");
        poly.setAttribute("fill", "none");
        poly.setAttribute("stroke", "rgba(226,184,110,0.95)");
        poly.setAttribute("stroke-width", "1.6");
        poly.setAttribute("stroke-linejoin", "round");
        poly.setAttribute("points", pts);
        svg.appendChild(poly);
        return svg;
      }

      // Last activity time: newest activity entry, else when the bot entered its current state.
      function lastActiveAt(bot) {
        const a = (bot.activity || [])[0];
        return (a && a.at) || bot.stateSince || "";
      }

      async function loadFleetStatus() {
        const res = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) throw new Error("status.json " + res.status);
        return res.json();
      }

      function buildScene() {
        const scene = document.getElementById("scene");
        BOTS.forEach((p) => {
          const pos = SCENE[p.id];
          if (!pos) return;
          const [dx, dy, dw, dh] = pos.desk;
          const desk = el("button", "desk");
          desk.type = "button";
          desk.style.left = dx + "%"; desk.style.top = dy + "%";
          desk.style.width = dw + "%"; desk.style.height = dh + "%";
          desk.setAttribute("aria-label", p.name + " desk. Open details");
          const mon = el("button", "mon idle");
          mon.type = "button";
          mon.style.left = pos.mx + "%"; mon.style.top = pos.my + "%";
          mon.appendChild(el("i"));
          mon.appendChild(el("span", null, "idle"));
          mon.setAttribute("aria-label", p.name + " status. Open details");
          [desk, mon].forEach((n) => n.addEventListener("click", (e) => { e.stopPropagation(); openPanel(p.id); }));
          scene.appendChild(desk);
          scene.appendChild(mon);
          sceneEls[p.id] = { desk: desk, mon: mon };
        });
      }

      function buildFloor() {
        const floor = document.getElementById("floor");
        PEOPLE.forEach((p) => floor.appendChild(buildCard(p)));
        document.addEventListener("click", () => closePanel());
      }

      function buildCard(person) {
        const card = el("article", "card glass");
        card.dataset.id = person.id;
        const top = el("div", "top");
        const port = el("div", "portrait");
        port.dataset.port = "";
        const iden = el("div", "iden");
        iden.appendChild(el("h3", null, person.name));
        iden.appendChild(el("p", null, person.role));
        top.appendChild(port);
        top.appendChild(iden);
        card.appendChild(top);
        mountPortrait(port, person, null);
        {
          const pill = el("span", "pill idle");
          pill.dataset.pill = "";
          pill.appendChild(el("i"));
          pill.appendChild(el("span", null, "idle"));
          top.appendChild(pill);
          const task = el("p", "task");
          task.dataset.task = "";
          card.appendChild(task);
          const grid = el("dl", "grid");
          [["done", "Tasks done today"],
           ["open", "Open tasks"],
           ["msgs", "Messages today"],
           ["up", "Running for"]].forEach(([k, label, title]) => {
            const d = el("div");
            d.appendChild(el("dt", null, label));
            const dd = el("dd");
            dd.dataset.k = k;
            d.appendChild(dd);
            grid.appendChild(d);
          });
          card.appendChild(grid);
          const extra = el("div", "extra");
          extra.dataset.extra = "";
          card.appendChild(extra);
          card.tabIndex = 0;
          card.setAttribute("role", "button");
          card.setAttribute("aria-label", person.name + ", " + person.role + ". Open details");
          card.addEventListener("click", (e) => { e.stopPropagation(); openPanel(person.id); });
          card.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openPanel(person.id); }
          });
        }
        cards[person.id] = card;
        return card;
      }

      function setDD(card, k, v) {
        const dd = card.querySelector('[data-k="' + k + '"]');
        if (!dd) return;
        dd.textContent = v;
        dd.parentNode.hidden = v === "";
      }

      function fillCard(card, meta, bot) {
        const status = ["idle", "busy", "error"].includes(bot.status) ? bot.status : "idle";
        card.classList.remove("is-idle", "is-busy", "is-error");
        card.classList.add("is-" + status);
        card.classList.toggle("is-open", openId === meta.id);
        const pill = card.querySelector("[data-pill]");
        pill.className = "pill " + status;
        pill.querySelector("span").textContent = status;

        const task = bot.currentTask || "";
        card.querySelector("[data-task]").textContent = FILLER.test(task) ? "" : task;

        const m = bot.msgsToday || {};
        setDD(card, "done", String(bot.tasksCompletedToday || 0));
        setDD(card, "open", String(bot.openTasks || 0));
        setDD(card, "up", durSince(bot.uptimeSince));
        const md = card.querySelector('[data-k="msgs"]');
        md.innerHTML = "";
        md.appendChild(document.createTextNode(String(m.sent || 0)));
        md.appendChild(el("small", null, " sent  "));
        md.appendChild(document.createTextNode(String(m.received || 0)));
        md.appendChild(el("small", null, " received"));

        const extra = card.querySelector("[data-extra]");
        extra.innerHTML = "";
        const last = (bot.activity || []).find((a) => a && a.text);
        if (last) {
          const p = el("p");
          p.title = "Last activity";
          p.appendChild(el("b", "ico", "●"));
          p.appendChild(el("span", null, last.text));
          const t = relTime(last.at);
          if (t) p.appendChild(el("em", null, t));
          extra.appendChild(p);
        }
        const errs = bot.errorCount || 0;
        const alerts = bot.alerts || [];
        if (errs > 0 || alerts.length) {
          const p = el("p", "alert");
          p.title = "Errors and alerts";
          p.appendChild(el("b", "ico", "⚠ " + Math.max(errs, alerts.length)));
          if (alerts[0] && alerts[0].text) p.appendChild(el("span", null, alerts[0].text));
          if (alerts[0] && alerts[0].at) p.appendChild(el("em", null, relTime(alerts[0].at)));
          extra.appendChild(p);
        }
        const h = bot.lastHandoff;
        if (h && h.with) {
          const p = el("p");
          p.title = "Last handoff";
          p.appendChild(el("b", "ico", h.direction === "from" ? "⇠" : "⇢"));
          p.appendChild(el("span", null, (h.direction === "from" ? "from " : "to ") + (NAMES[h.with] || h.with) + (h.label ? " · " + h.label : "")));
          const t = relTime(h.at);
          if (t) p.appendChild(el("em", null, t));
          extra.appendChild(p);
        }
        mountPortrait(card.querySelector("[data-port]"), meta, bot);
      }

      function applySnapshot(data) {
        snapshot = data;
        const counts = { total: 0, busy: 0, idle: 0, error: 0 };
        const byId = {};
        (data.bots || []).forEach((b) => { byId[b.id] = b; });
        BOTS.forEach((meta) => {
          const bot = byId[meta.id];
          if (!bot) return;
          counts.total += 1;
          if (counts[bot.status] != null) counts[bot.status] += 1;
          fillCard(cards[meta.id], meta, bot);
          const sc = sceneEls[meta.id];
          if (sc) {
            const st = ["idle", "busy", "error"].includes(bot.status) ? bot.status : "idle";
            sc.mon.className = "mon " + st + (openId === meta.id ? " is-open" : "");
            sc.mon.querySelector("span").textContent = st;
            sc.mon.title = meta.name + ": " + st;
            sc.desk.classList.toggle("is-open", openId === meta.id);
          }
        });
        renderUsage(data.usage);
        ["total", "busy", "idle", "error"].forEach((k) => {
          document.getElementById("c-" + k).textContent = String(counts[k]);
        });
        document.getElementById("c-msgs").textContent = String(data.messagesLastMinute || 0);
        (data.handoffs || []).forEach((h) => spawnParticle(h.from, h.to));
        if (openId) renderPanel(openId);
      }

      function seatCenter(id) {
        const card = cards[id];
        const floor = document.getElementById("floor");
        if (!card) return null;
        const r = card.querySelector(".portrait").getBoundingClientRect();
        const f = floor.getBoundingClientRect();
        return { x: r.left + r.width / 2 - f.left, y: r.top + r.height / 2 - f.top };
      }

      function spawnParticle(from, to) {
        const a = seatCenter(from);
        const b = seatCenter(to);
        if (!a || !b || reduceMotion) return;
        const ns = "http://www.w3.org/2000/svg";
        const layer = document.getElementById("handoff-layer");
        const g = document.createElementNS(ns, "g");
        const glow = document.createElementNS(ns, "circle");
        glow.setAttribute("class", "particle-glow");
        glow.setAttribute("r", "7");
        const core = document.createElementNS(ns, "circle");
        core.setAttribute("class", "particle");
        core.setAttribute("r", "3.4");
        g.appendChild(glow);
        g.appendChild(core);
        layer.appendChild(g);
        particles.push({ node: g, core: core, glow: glow, ax: a.x, ay: a.y, bx: b.x, by: b.y, start: performance.now(), duration: 900 + Math.random() * 400 });
      }

      function tickParticles(now) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          const t = (now - p.start) / p.duration;
          if (t >= 1) { p.node.remove(); particles.splice(i, 1); continue; }
          const u = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          const x = (p.ax + (p.bx - p.ax) * u).toFixed(2);
          const y = (p.ay + (p.by - p.ay) * u).toFixed(2);
          p.core.setAttribute("cx", x); p.core.setAttribute("cy", y);
          p.glow.setAttribute("cx", x); p.glow.setAttribute("cy", y);
          p.node.setAttribute("opacity", String(t < 0.1 ? t / 0.1 : t > 0.85 ? (1 - t) / 0.15 : 1));
        }
      }

      function openPanel(id) {
        openId = id;
        markOpen();
        renderPanel(id);
        const panel = document.getElementById("panel");
        panel.classList.add("open");
        panel.setAttribute("aria-hidden", "false");
      }

      function closePanel() {
        if (!openId) return;
        openId = null;
        markOpen();
        const panel = document.getElementById("panel");
        panel.classList.remove("open");
        panel.setAttribute("aria-hidden", "true");
      }

      function timedList(items, cls) {
        const ul = el("ul", "list" + (cls ? " " + cls : ""));
        items.forEach((it) => {
          const li = el("li");
          const t = el("time", null, relTime(it.at));
          t.dateTime = it.at || "";
          li.appendChild(t);
          li.appendChild(el("span", null, it.text || ""));
          ul.appendChild(li);
        });
        return ul;
      }

      // The panel adds what the card does not show: the 12-hour trend, every alert, and the activity log.
      function renderPanel(id) {
        const meta = BY_ID[id];
        const bot = snapshot && (snapshot.bots || []).find((b) => b.id === id);
        if (!meta || !bot) return;
        document.getElementById("p-name").textContent = meta.name;
        document.getElementById("p-role").textContent = meta.role;
        mountPortrait(document.getElementById("p-avatar"), meta, bot);
        const body = document.getElementById("p-body");
        body.innerHTML = "";
        const since = durSince(bot.stateSince);
        if (since) {
          const st = el("div", "pstat");
          st.appendChild(el("span", null, "In this status for"));
          st.appendChild(el("b", null, since));
          body.appendChild(st);
        }
        body.appendChild(el("span", "block-label", "Activity, last 12 hours"));
        const spark = sparkSVG(bot.activityHistory || [], 340, 48);
        spark.id = "p-spark";
        body.appendChild(spark);
        const alerts = (bot.alerts || []).filter((a) => a && a.text);
        if (alerts.length) {
          body.appendChild(el("span", "block-label", "Alerts"));
          body.appendChild(timedList(alerts, "alerts"));
        }
        const acts = (bot.activity || []).filter((a) => a && a.text);
        if (acts.length) {
          body.appendChild(el("span", "block-label", "Activity log"));
          body.appendChild(timedList(acts));
        }
      }

      function markOpen() {
        Object.keys(cards).forEach((k) => cards[k].classList.toggle("is-open", k === openId));
        Object.keys(sceneEls).forEach((k) => {
          sceneEls[k].mon.classList.toggle("is-open", k === openId);
          sceneEls[k].desk.classList.toggle("is-open", k === openId);
        });
      }

      function fmtTime(iso) {
        const d = iso ? new Date(iso) : null;
        if (!d || !isFinite(d.getTime())) return "";
        return new Intl.DateTimeFormat("en-US", { timeZone: USAGE_TZ, weekday: "short", hour: "numeric", minute: "2-digit" }).format(d);
      }

      function pctText(v) {
        if (v == null || v === "") return "";
        return String(v).replace(/%$/, "") + "%";
      }

      function renderUsage(u) {
        const box = document.getElementById("usage");
        if (!u || u.weekUsedPct == null) { box.hidden = true; return; }
        box.hidden = false;
        const used = Number(u.weekUsedPct);
        document.getElementById("u-used").textContent = Math.round(used) + "%";
        document.getElementById("u-bar").style.width = Math.min(100, Math.max(0, used)) + "%";
        const ol = document.getElementById("u-list");
        ol.innerHTML = "";
        (u.shares || []).filter((r) => r && r.id && NAMES[r.id]).slice(0, USAGE_TOP).forEach((r) => {
          const li = el("li", null, NAMES[r.id]);
          li.appendChild(el("b", null, pctText(r.pct)));
          ol.appendChild(li);
        });
        const parts = [];
        if (u.snapshotAt) parts.push("Snapshot " + fmtTime(u.snapshotAt));
        if (u.resetsAt) parts.push("resets " + fmtTime(u.resetsAt));
        document.getElementById("u-meta").textContent = parts.length ? parts.join(" · ") + " (Dubai time)" : "";
      }

      function updateClock() {
        const now = new Date();
        document.getElementById("clock").textContent = new Intl.DateTimeFormat(undefined, {
          weekday: "short", hour: "numeric", minute: "2-digit", second: "2-digit"
        }).format(now);
        const tz = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" }).formatToParts(now).find((p) => p.type === "timeZoneName");
        document.getElementById("tz").textContent = tz ? tz.value : "";
      }

      async function refresh() {
        try {
          applySnapshot(await loadFleetStatus());
        } catch (err) {
          console.error("Failed to load fleet status", err);
        }
      }

      function loop(now) {
        tickParticles(now);
        requestAnimationFrame(loop);
      }

      document.body.classList.toggle("is-live", USE_STATUS_JSON);
      document.getElementById("p-close").addEventListener("click", (e) => { e.stopPropagation(); closePanel(); });
      document.getElementById("panel").addEventListener("click", (e) => e.stopPropagation());
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

      buildScene();
      buildFloor();
      updateClock();
      setInterval(updateClock, 1000);
      refresh();
      setInterval(refresh, 3000);
      requestAnimationFrame(loop);

      const preset = new URLSearchParams(location.search).get("panel");
      if (preset && BY_ID[preset]) setTimeout(() => openPanel(preset), 300);
    })();
  </script>
</body>
