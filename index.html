<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fleet Monitor</title>
  <!--
    Fleet Monitor — office floor
    ----------------------------
    Single-file dashboard. No backend required. To drive it from a real
    source later, set USE_STATUS_JSON to true in the script below and
    serve a status.json file next to this page. loadFleetStatus() is
    the single function to swap.

    Weekly usage figures on the page come from the USAGE snapshot in
    the script, not from the simulator. All other live-looking bot
    metrics are simulated unless USE_STATUS_JSON is true.

    Expected status.json shape:

    {
      "updatedAt": "2026-11-15T15:00:00.000Z",
      "messagesLastMinute": 7,
      "bots": [
        {
          "id": "donna",
          "name": "DONNA",
          "role": "Manager / coordinator",
          "status": "idle",
          "currentTask": "Reviewing assignments",
          "avatar": "",
          "tasksCompletedToday": 11,
          "openTasks": 4,
          "errorCount": 0,
          "alerts": [
            { "at": "2026-11-15T14:10:00.000Z", "text": "Optional alert text" }
          ],
          "uptimeSince": "2026-11-15T08:12:00.000Z",
          "stateSince": "2026-11-15T14:40:00.000Z",
          "msgsToday": { "sent": 28, "received": 31 },
          "lastHandoff": {
            "with": "milo",
            "direction": "to",
            "at": "2026-11-15T14:51:00.000Z",
            "label": "task brief"
          },
          "activityHistory": [2, 1, 0, 3, 4, 6, 5, 8, 7, 6, 4, 5],
          "activity": [
            { "at": "2026-11-15T14:51:00.000Z", "text": "Assigned a brief to MILO" }
          ]
        }
      ],
      "handoffs": [
        { "from": "donna", "to": "milo", "label": "Task brief" }
      ]
    }

    status must be one of: "idle" | "busy" | "error"
    avatar is an optional image URL; when missing or if the image fails,
    the built-in SVG portrait is used. The URL must not be required for
    the page to work offline.
    activityHistory is 12 numbers, oldest first, one bucket per hour.
    handoffs are consumed once, to spawn a travelling particle.
    activity timestamps should be ISO-8601.
    Bot ids used in this file: donna, milo, colin, alex, audrey,
    security, legal, mailman, morgan, research.
    Zaid is the owner seat and is not part of the bots array.
  -->
  <style>
    :root {
      --bg: #07090d;
      --bg-soft: #0d1118;
      --header: rgba(10, 13, 20, 0.92);
      --panel: #10151e;
      --bay: rgba(16, 21, 30, 0.78);
      --desk: #161c27;
      --rail: #2a3344;
      --line: rgba(232, 236, 242, 0.08);
      --line-strong: rgba(232, 236, 242, 0.16);
      --text: #e8ecf2;
      --muted: #8b94a3;
      --faint: #5c6573;
      --idle: #3ee0b8;
      --idle-dim: rgba(62, 224, 184, 0.18);
      --busy: #f5c14a;
      --busy-dim: rgba(245, 193, 74, 0.2);
      --error: #f07178;
      --error-dim: rgba(240, 113, 120, 0.2);
      --accent: #8fb0ff;
      --gold: #c4a35a;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      --sans: "Segoe UI", "Avenir Next", "Trebuchet MS", system-ui, -apple-system, sans-serif;
      --mono: "SF Mono", "Cascadia Mono", "Consolas", ui-monospace, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      color-scheme: dark;
    }

    body {
      background:
        radial-gradient(ellipse 80% 50% at 50% 0%, rgba(80, 110, 170, 0.1), transparent 55%),
        var(--bg);
    }

    #app {
      display: flex;
      flex-direction: column;
      min-height: 100%;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      gap: 20px;
      height: 64px;
      padding: 0 22px;
      background: var(--header);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 6;
      flex-shrink: 0;
    }

    .brand { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    .brand-text { display: flex; flex-direction: column; gap: 1px; }
    .brand-text strong {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .brand-text span {
      font-size: 11px;
      color: var(--muted);
    }

    .live {
      display: none;
      align-items: center;
      gap: 6px;
      margin-left: 6px;
      color: var(--idle);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    body.is-live .live { display: inline-flex; }
    .live i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--idle);
      box-shadow: 0 0 8px var(--idle);
      animation: blink 2.2s ease-in-out infinite;
    }

    .demo-tag {
      display: none;
      align-items: center;
      height: 22px;
      padding: 0 8px;
      border: 1px dashed rgba(245, 193, 74, 0.5);
      border-radius: 999px;
      color: var(--busy);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    body.is-demo .demo-tag { display: inline-flex; }

    .stats { display: flex; align-items: stretch; gap: 8px; margin-left: auto; }
    .stat {
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 72px;
      padding: 5px 11px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .stat b {
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      line-height: 1.2;
    }
    .stat em {
      font-style: normal;
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .stat[data-k="busy"] b { color: var(--busy); }
    .stat[data-k="idle"] b { color: var(--idle); }
    .stat[data-k="error"] b { color: var(--error); }
    .stat[data-k="msgs"] b { color: var(--accent); }
    .stat[data-k="usage"] b { color: var(--accent); }
    .stat .ubar {
      display: block; width: 100%; height: 3px; margin-top: 4px;
      border-radius: 2px; background: rgba(255,255,255,0.08); overflow: hidden;
    }
    .stat .ubar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }

    .clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
      margin-left: 8px;
      min-width: 148px;
      padding-left: 18px;
      border-left: 1px solid var(--line);
      flex-shrink: 0;
    }
    .clock time {
      font-family: var(--mono);
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }
    .clock small {
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    main {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: auto;
    }

    .hero {
      position: relative;
      margin: 22px 300px 0 22px;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
      height: clamp(220px, 34vw, 440px);
      background: #1a140f url("office.jpg") center / cover no-repeat;
    }
    .hero::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, rgba(0,0,0,0) 65%, rgba(10,12,18,0.55) 100%);
    }
    @media (max-width: 900px) { .hero { margin: 14px 14px 0; } }

    .floor-wrap {
      position: relative;
      min-height: 100%;
      padding: 22px 300px 80px 22px;
    }

    #floor {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      grid-template-areas:
        "owner owner owner owner"
        "mgr   mgr   mgr   mgr"
        "eng   eng   design audit"
        "comp  comp  prop  prop";
      gap: 16px;
      max-width: 1440px;
      margin: 0 auto;
    }

    #handoff-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
      z-index: 3;
    }
    .particle { fill: #eef3ff; }
    .particle-glow { fill: rgba(215, 228, 255, 0.35); }

    .bay {
      background: var(--bay);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 12px 14px;
      min-width: 0;
    }
    .bay.owner { grid-area: owner; background: linear-gradient(180deg, rgba(196,163,90,0.07), var(--bay)); }
    .bay.manager { grid-area: mgr; }
    .bay.engineering { grid-area: eng; }
    .bay.design { grid-area: design; }
    .bay.audit { grid-area: audit; }
    .bay.compliance { grid-area: comp; }
    .bay.property { grid-area: prop; }

    .bay h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 2px 10px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .bay h2 i {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: var(--accent);
      opacity: 0.8;
    }
    .bay.owner h2 i { background: var(--gold); }
    .bay.manager h2 i { background: var(--accent); }
    .bay.engineering h2 i { background: var(--idle); }
    .bay.design h2 i { background: #e08b6a; }
    .bay.audit h2 i { background: #c56b7a; }
    .bay.compliance h2 i { background: #8b94a3; }
    .bay.property h2 i { background: #8fbf7a; }

    .seats {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }
    .bay.owner .seats,
    .bay.manager .seats {
      grid-template-columns: minmax(280px, 560px);
      justify-content: center;
    }

    .cube, .office {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
      padding: 12px 12px 10px;
      background: var(--desk);
      border: 1px solid var(--line);
      border-radius: 4px 4px 10px 10px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      font: inherit;
      box-shadow: inset 0 10px 0 0 var(--rail);
      padding-top: 18px;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
    }
    .cube:hover, .office:hover, .cube:focus-visible, .office:focus-visible {
      background: #1c2432;
      border-color: var(--line-strong);
      outline: none;
    }
    .cube.is-open, .office.is-open {
      border-color: rgba(232, 236, 242, 0.35);
      box-shadow: inset 0 10px 0 0 var(--rail), 0 0 0 1px rgba(232,236,242,0.2);
    }
    .cube.is-busy { box-shadow: inset 0 10px 0 0 var(--rail), 0 0 0 1px rgba(245,193,74,0.22); }
    .cube.is-error {
      box-shadow: inset 0 10px 0 0 var(--rail);
      border-style: dashed;
      border-color: rgba(240, 113, 120, 0.55);
    }
    .cube.is-busy .portrait { box-shadow: 0 0 0 2px var(--busy), 0 0 14px rgba(245,193,74,0.35); }
    .cube.is-idle .portrait { box-shadow: 0 0 0 2px var(--idle); }
    .cube.is-error .portrait { box-shadow: 0 0 0 2px var(--error); }
    .cube.is-busy .portrait { animation: ringpulse 1.8s ease-in-out infinite; }
    .office .portrait { box-shadow: 0 0 0 2px var(--gold); }

    .top {
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 10px;
      align-items: start;
      min-width: 0;
    }
    .office .top { grid-template-columns: 72px 1fr; }

    .portrait {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      overflow: hidden;
      background: #1a212d;
      flex-shrink: 0;
    }
    .office .portrait { width: 72px; height: 72px; }
    .portrait svg, .portrait img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .iden { min-width: 0; }
    .name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    .name-row h3 {
      font-size: 13px;
      font-weight: 650;
      letter-spacing: 0.03em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .role {
      margin-top: 1px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .task {
      margin-top: 4px;
      font-size: 11px;
      line-height: 1.35;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 18px;
      padding: 0 7px;
      border-radius: 999px;
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .badge i { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.idle { color: var(--idle); background: var(--idle-dim); }
    .badge.busy { color: var(--busy); background: var(--busy-dim); }
    .badge.error { color: var(--error); background: var(--error-dim); }
    .badge.owner { color: var(--gold); background: rgba(196,163,90,0.16); }

    .err-pill {
      display: none;
      align-items: center;
      justify-content: center;
      min-width: 16px;
      height: 16px;
      padding: 0 5px;
      border-radius: 999px;
      background: var(--error);
      color: #1a0a0c;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .err-pill.show { display: inline-flex; }

    .last {
      display: flex;
      gap: 8px;
      align-items: baseline;
      min-width: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.3;
    }
    .last .k {
      color: var(--faint);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .last .k { flex-shrink: 0; }
    .last .txt {
      min-width: 0;
      flex: 0 1 auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text);
    }
    .last time {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 9px;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      height: 18px;
      padding: 0 6px;
      border-radius: 4px;
      background: rgba(255,255,255,0.035);
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .chip b { color: var(--text); font-weight: 500; }
    .chip.none b { color: var(--faint); font-weight: 400; }
    .chip.snap { border-color: rgba(143,176,255,0.2); }
    .chip.warn { color: var(--error); border-color: rgba(240,113,120,0.3); background: var(--error-dim); }
    .chip.warn b { color: var(--error); }

    .foot {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      align-items: center;
      min-width: 0;
    }
    .handoff {
      min-width: 0;
      color: var(--muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .handoff em { font-style: normal; color: var(--accent); }
    .spark { width: 56px; height: 16px; display: block; }
    .demo-mark {
      display: none;
      color: var(--busy);
      font-family: var(--mono);
      font-size: 8px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    body.is-demo .cube .demo-mark { display: inline; }

    .office .note {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .legend {
      position: absolute;
      left: 22px;
      bottom: 22px;
      display: flex;
      gap: 14px;
      z-index: 4;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      pointer-events: none;
    }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .legend .l-idle { background: var(--idle); box-shadow: 0 0 8px var(--idle); }
    .legend .l-busy { background: var(--busy); box-shadow: 0 0 8px var(--busy); }
    .legend .l-error { background: var(--error); box-shadow: 0 0 8px var(--error); }

    .usage-card {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 260px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(14,18,28,0.9);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(8px);
      font-size: 12px;
      z-index: 6;
      transition: opacity 0.25s;
    }
    .usage-card h3 { margin: 0 0 2px; font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
    .usage-card .sub { opacity: 0.55; margin-bottom: 10px; display: block; }
    .usage-card .total { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .usage-card .bigbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); overflow: hidden; margin-bottom: 12px; }
    .usage-card .bigbar i { display: block; height: 100%; background: var(--accent); }
    .usage-card ul { list-style: none; margin: 0; padding: 0; }
    .usage-card li { display: grid; grid-template-columns: 90px 1fr 38px; align-items: center; gap: 8px; margin: 5px 0; }
    .usage-card li .bar { height: 4px; border-radius: 2px; background: rgba(255,255,255,0.06); overflow: hidden; }
    .usage-card li .bar i { display: block; height: 100%; background: var(--idle); }
    .usage-card li span:last-child { text-align: right; opacity: 0.8; }
    .usage-card .reset { margin-top: 10px; opacity: 0.55; display: block; }
    .usage-card .snap-tag {
      display: inline-block;
      margin-left: 6px;
      color: var(--accent);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    body.panel-open .usage-card,
    body.panel-open .legend { opacity: 0; visibility: hidden; pointer-events: none; }

    #panel {
      position: fixed;
      top: 80px;
      right: 16px;
      bottom: 16px;
      width: min(420px, calc(100% - 32px));
      display: flex;
      flex-direction: column;
      background-color: #10151e;
      border: 1px solid var(--line-strong);
      border-radius: 16px;
      box-shadow: var(--shadow);
      transform: translateX(24px);
      visibility: hidden;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }
    #panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background: #10151e;
      border-radius: 16px;
      z-index: 0;
    }
    .panel-head, .panel-body { position: relative; z-index: 1; }
    #panel.open {
      transform: translateX(0);
      visibility: visible;
      pointer-events: auto;
      animation: slide-in 0.22s ease-out;
    }
    .panel-head {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 20px 20px 16px;
      border-bottom: 1px solid var(--line);
    }
    #p-avatar.portrait {
      width: 88px;
      height: 88px;
      box-shadow: 0 0 0 2px var(--idle);
      flex-shrink: 0;
    }
    #p-avatar[data-status="busy"] { box-shadow: 0 0 0 2px var(--busy); }
    #p-avatar[data-status="error"] { box-shadow: 0 0 0 2px var(--error); }
    #p-avatar[data-status="owner"] { box-shadow: 0 0 0 2px var(--gold); }
    .who { flex: 1; min-width: 0; }
    .who h2 { font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
    .who p { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .close {
      width: 32px; height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }
    .close:hover, .close:focus-visible { color: var(--text); border-color: var(--line-strong); outline: none; }
    .panel-body { padding: 16px 20px 24px; overflow: auto; flex: 1; }
    .panel-flags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 14px; }
    .sim-note {
      display: none;
      color: var(--busy);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    body.is-demo #panel:not(.is-owner) .sim-note { display: inline; }
    .block-label {
      display: block;
      margin: 14px 0 7px;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .taskbox {
      padding: 11px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.45;
    }
    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric {
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .metric b {
      display: block;
      font-family: var(--mono);
      font-size: 16px;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    .metric span {
      display: block;
      margin-top: 2px;
      color: var(--faint);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .metric.alert b { color: var(--error); }
    .metric.snap b { color: var(--accent); }
    .alerts { list-style: none; }
    .alerts li {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
      color: var(--error);
    }
    .alerts time, .activity time {
      color: var(--faint);
      font-family: var(--mono);
      font-size: 10px;
      padding-top: 2px;
    }
    .activity { list-style: none; }
    .activity li {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 10px;
      padding: 9px 0;
      border-top: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.4;
    }
    .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
    #p-spark { width: 100%; height: 48px; display: block; }

    .sprite { position: absolute; left: 0; top: 0; width: 0; height: 0; overflow: hidden; }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    @keyframes ringpulse {
      0%, 100% { box-shadow: 0 0 0 2px var(--busy), 0 0 10px rgba(245,193,74,0.25); }
      50% { box-shadow: 0 0 0 3px var(--busy), 0 0 18px rgba(245,193,74,0.5); }
    }
    @keyframes slide-in {
      from { transform: translateX(24px); }
      to { transform: translateX(0); }
    }

    @media (max-width: 1180px) {
      #floor {
        grid-template-columns: 1fr 1fr;
        grid-template-areas:
          "owner owner"
          "mgr mgr"
          "eng eng"
          "design audit"
          "comp prop";
      }
      .stat { min-width: 58px; padding: 5px 8px; }
      .clock { min-width: 120px; padding-left: 12px; }
      header { gap: 12px; padding: 0 14px; }
    }
    @media (max-width: 760px) {
      #floor { grid-template-columns: 1fr; grid-template-areas: "owner" "mgr" "eng" "design" "audit" "comp" "prop"; }
      .brand-text span { display: none; }
      .floor-wrap { padding: 16px 16px 230px; }
      .usage-card { width: calc(100% - 28px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .live i, .cube.is-busy .portrait { animation: none; }
      #panel.open { animation: none; }
    }
  </style>
</head>

      function relTime(iso) {
        if (!iso) return "—";
        const ms = Date.now() - new Date(iso).getTime();
        if (ms < 8000) return "just now";
        if (ms < 60000) return Math.round(ms / 1000) + "s ago";
        if (ms < 3600000) return Math.round(ms / 60000) + "m ago";
        if (ms < 86400000) return Math.round(ms / 3600000) + "h ago";
        return Math.round(ms / 86400000) + "d ago";
      }

      function durSince(iso) {
        if (!iso) return "—";
        const ms = Math.max(0, Date.now() - new Date(iso).getTime());
        if (ms < 60000) return Math.max(1, Math.round(ms / 1000)) + "s";
        if (ms < 3600000) return Math.round(ms / 60000) + "m";
        if (ms < 86400000) {
          const h = Math.floor(ms / 3600000);
          const m = Math.round((ms % 3600000) / 60000);
          return m ? h + "h " + m + "m" : h + "h";
        }
        return Math.round(ms / 86400000) + "d";
      }

      function escapeAttr(s) {
        return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
      }

      function svgUse(id) {
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        svg.setAttribute("class", "face");
        svg.setAttribute("viewBox", "0 0 80 80");
        svg.setAttribute("aria-hidden", "true");
        const use = document.createElementNS("http://www.w3.org/2000/svg", "use");
        use.setAttribute("href", "#avatar-" + id);
        use.setAttributeNS("http://www.w3.org/1999/xlink", "href", "#avatar-" + id);
        svg.appendChild(use);
        return svg;
      }

      function mountPortrait(container, person, live) {
        const url = (live && live.avatar) || person.avatar || "";
        if (container.dataset.avatarKey === url && container.childNodes.length) return;
        container.dataset.avatarKey = url;
        container.innerHTML = "";
        if (url) {
          const img = document.createElement("img");
          img.className = "face-img";
          img.alt = "";
          img.src = url;
          img.addEventListener("error", function () {
            container.innerHTML = "";
            container.appendChild(svgUse(person.id));
          });
          container.appendChild(img);
        } else {
          container.appendChild(svgUse(person.id));
        }
      }

      function sparkSVG(values, w, h, color) {
        const ns = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(ns, "svg");
        svg.setAttribute("class", "spark");
        svg.setAttribute("viewBox", "0 0 " + w + " " + h);
        svg.setAttribute("width", String(w));
        svg.setAttribute("height", String(h));
        svg.setAttribute("aria-hidden", "true");
        const data = (values && values.length ? values : [0, 0]).slice();
        const max = Math.max(1, ...data);
        const step = data.length > 1 ? (w - 2) / (data.length - 1) : w;
        const pts = data.map((v, i) => {
          const x = 1 + i * step;
          const y = h - 1 - (v / max) * (h - 4);
          return x.toFixed(1) + "," + y.toFixed(1);
        }).join(" ");
        const poly = document.createElementNS(ns, "polyline");
        poly.setAttribute("fill", "none");
        poly.setAttribute("stroke", color || "rgba(143,176,255,0.9)");
        poly.setAttribute("stroke-width", "1.4");
        poly.setAttribute("stroke-linejoin", "round");
        poly.setAttribute("stroke-linecap", "round");
        poly.setAttribute("points", pts);
        svg.appendChild(poly);
        return svg;
      }

      function lastActivity(bot) {
        const items = bot.activity || [];

          if (b.id !== "donna") {
            activity.push({
              at: new Date(now - (120 + i * 35) * 1000).toISOString(),
              text: "Received a brief from DONNA"
            });
          } else {
            activity.push({
              at: new Date(now - 180000).toISOString(),
              text: "Opened the morning board"
            });
          }
          const lastFromDonna = b.id !== "donna";
          const lastHandoff = lastFromDonna
            ? { with: "donna", direction: "from", at: activity[activity.length - 1].at, label: "task brief" }
            : { with: "milo", direction: "to", at: new Date(now - 180000).toISOString(), label: "task brief" };

          const alerts = [];
          let errorCount = 0;
          if (status === "error") {
            errorCount = 1;
            alerts.push({ at: activity[0].at, text: "Hit a snag and flagged it" });
          }

          sim.bots[b.id] = {
            status: status,
            currentTask: task,
            activity: activity,
            tasksCompletedToday: s.done,
            openTasks: s.open,
            errorCount: errorCount,
            alerts: alerts,
            uptimeSince: new Date(now - s.upH * 3600000).toISOString(),
            stateSince: new Date(now - s.stateMin * 60000).toISOString(),
            msgsToday: { sent: s.sent, received: s.recv },
            lastHandoff: lastHandoff,
            activityHistory: s.hist.slice()
          };
        });

        for (let i = 0; i < 5; i++) sim.messages.push({ at: now - (10 + i * 8) * 1000 });
        sim.pendingHandoffs.push({ from: "donna", to: "milo", label: "task brief" });
        sim.pendingHandoffs.push({ from: "milo", to: "colin", label: "review request" });
        sim.pendingHandoffs.push({ from: "donna", to: "alex", label: "follow-up" });
      }

      function pushActivity(id, text) {
        const bot = sim.bots[id];
        bot.activity.unshift({ at: new Date().toISOString(), text: text });
        if (bot.activity.length > 12) bot.activity.length = 12;
        const hist = bot.activityHistory;
        if (hist && hist.length) hist[hist.length - 1] += 1;
      }

      function setState(id, status, task) {
        const bot = sim.bots[id];
        if (bot.status !== status) bot.stateSince = new Date().toISOString();
        bot.status = status;
        if (task != null) bot.currentTask = task;
      }

      function connectedPartners(id) {
        const out = [];
        EDGES.forEach(([a, b]) => {
          if (a === id) out.push(b);
          else if (b === id) out.push(a);
        });
        return out;
      }

      function fireHandoff(from, to, label) {
        const note = label || pick(HANDOFF_LABELS);
        const at = new Date().toISOString();
        sim.pendingHandoffs.push({ from: from, to: to, label: note });
        sim.messages.push({ at: Date.now() });
        const A = sim.bots[from];
        const B = sim.bots[to];
        A.msgsToday.sent += 1;
        B.msgsToday.received += 1;
        A.lastHandoff = { with: to, direction: "to", at: at, label: note };
        B.lastHandoff = { with: from, direction: "from", at: at, label: note };
        pushActivity(from, "Sent to " + NAMES[to] + ": " + note);
        pushActivity(to, "Received from " + NAMES[from] + ": " + note);
        if (B.status === "idle") {
          setState(to, "busy", pick(TASKS[to]));
        }
      }

      function simulateTick() {
        const ids = BOTS.map((b) => b.id);
        const roll = Math.random();

        if (roll < 0.45) {
          const from = Math.random() < 0.55 ? "donna" : pick(ids);
          const partners = connectedPartners(from);
          if (partners.length) {
            const to = pick(partners);
            if (to !== from) fireHandoff(from, to);
          }
        } else if (roll < 0.8) {
          const id = pick(ids);
          const bot = sim.bots[id];
          if (bot.status === "error") {
            setState(id, "busy", pick(TASKS[id]));
            pushActivity(id, "Recovered and resumed work");
          } else if (bot.status === "busy" && Math.random() < 0.4) {
            bot.tasksCompletedToday += 1;
            if (bot.openTasks > 0) bot.openTasks -= 1;
            setState(id, "idle", "Standing by");
            pushActivity(id, "Finished the current task");
          } else {
            bot.openTasks += 1;
            setState(id, "busy", pick(TASKS[id]));
            pushActivity(id, "Started: " + bot.currentTask);
          }
        } else if (roll < 0.9) {
          const id = pick(ids.filter((x) => x !== "donna"));
          if (sim.bots[id].status !== "error") {
            setState(id, "error", "Blocked — needs a look");
            sim.bots[id].errorCount += 1;
            sim.bots[id].alerts.unshift({ at: new Date().toISOString(), text: "Hit a snag and flagged it" });
            if (sim.bots[id].alerts.length > 5) sim.bots[id].alerts.length = 5;
            pushActivity(id, "Hit a snag and flagged it");
          }
        }

        const cutoff = Date.now() - 60000;
        sim.messages = sim.messages.filter((m) => m.at >= cutoff);
      }

      function simulateFleetStatus() {
        const now = Date.now();
        return {
          updatedAt: new Date(now).toISOString(),
          messagesLastMinute: sim.messages.filter((m) => now - m.at < 60000).length,
          bots: BOTS.map((meta) => {
            const live = sim.bots[meta.id];
            return {
              id: meta.id,
              name: meta.name,
              role: meta.role,
              status: live.status,
              currentTask: live.currentTask,
              activity: live.activity.slice(),
              tasksCompletedToday: live.tasksCompletedToday,
              openTasks: live.openTasks,
              errorCount: live.errorCount,
              alerts: live.alerts.slice(),
              uptimeSince: live.uptimeSince,
              stateSince: live.stateSince,
              msgsToday: { sent: live.msgsToday.sent, received: live.msgsToday.received },
              lastHandoff: live.lastHandoff ? Object.assign({}, live.lastHandoff) : null,
              activityHistory: live.activityHistory.slice()
            };
          }),
          handoffs: sim.pendingHandoffs.splice(0)
        };
      }

      async function loadFleetStatus() {
        if (USE_STATUS_JSON) {
          const res = await fetch("status.json?t=" + Date.now(), { cache: "no-store" });
          if (!res.ok) throw new Error("status.json " + res.status);
          return res.json();
        }
        return simulateFleetStatus();
      }

      function applySnapshot(data) {
        snapshot = data;
        const counts = { total: 0, busy: 0, idle: 0, error: 0 };
        const byId = {};
        (data.bots || []).forEach((bot) => { byId[bot.id] = bot; });

        BOTS.forEach((meta) => {
          const bot = byId[meta.id];
          const el = seatEls[meta.id];
          if (!bot || !el) return;
          counts.total += 1;
          counts[bot.status] = (counts[bot.status] || 0) + 1;
          el.classList.remove("is-idle", "is-busy", "is-error");
          el.classList.add("is-" + bot.status);
          el.classList.toggle("is-open", openId === bot.id);
          const badge = el.querySelector("[data-badge]");
          if (badge) {
            badge.className = "badge " + bot.status;
            badge.querySelector("span").textContent = bot.status;
          }
          const err = el.querySelector("[data-err]");
          if (err) {
            const n = bot.errorCount || 0;
            err.textContent = String(n);
            err.classList.toggle("show", n > 0);
          }
          const task = el.querySelector("[data-task]");
          if (task) task.textContent = bot.currentTask || "Standing by";
          const last = lastActivity(bot);
          const lastTxt = el.querySelector("[data-last]");
          const lastAt = el.querySelector("[data-last-at]");
          if (lastTxt) lastTxt.textContent = last ? last.text : "No recent activity";
          if (lastAt) {
            lastAt.textContent = last ? relTime(last.at) : "";
            lastAt.dateTime = last ? last.at : "";
          }
          fillChips(el, bot);
          const ho = el.querySelector("[data-handoff]");
          if (ho) {
            ho.innerHTML = "";
            const h = bot.lastHandoff;
            if (!h || !h.with) {
              ho.textContent = "No handoff yet";
            } else {
              ho.appendChild(document.createTextNode(handoffText(h) + " · "));
              const t = document.createElement("em");
              t.textContent = relTime(h.at);
              ho.appendChild(t);
            }
          }
          const sparkHold = el.querySelector("[data-spark]");
          if (sparkHold) {
            sparkHold.innerHTML = "";
            const spark = sparkSVG(bot.activityHistory || [], 56, 16);
            spark.setAttribute("title", "Activity over the last 12 hours");
            sparkHold.appendChild(spark);
          }
          mountPortrait(el.querySelector("[data-port]"), meta, bot);
        });

        const ownerEl = seatEls.zaid;
        if (ownerEl) ownerEl.classList.toggle("is-open", openId === "zaid");

        document.getElementById("c-total").textContent = String(counts.total);
        document.getElementById("c-busy").textContent = String(counts.busy);
        document.getElementById("c-idle").textContent = String(counts.idle);
        document.getElementById("c-error").textContent = String(counts.error);
        document.getElementById("c-msgs").textContent = String(data.messagesLastMinute || 0);

        (data.handoffs || []).forEach((h) => spawnParticle(h.from, h.to));
        if (openId) renderPanel(openId);
      }

      function seatCenter(id) {
        const el = seatEls[id];
        const wrap = document.getElementById("floor-wrap");
        if (!el || !wrap) return null;
        const portrait = el.querySelector(".portrait") || el;
        const r = portrait.getBoundingClientRect();
        const w = wrap.getBoundingClientRect();
        return {
          x: r.left + r.width / 2 - w.left + wrap.scrollLeft,
          y: r.top + r.height / 2 - w.top + wrap.scrollTop
        };
      }

      function spawnParticle(from, to) {
        const a = seatCenter(from);
        const b = seatCenter(to);
        if (!a || !b || reduceMotion) return;
        const layer = document.getElementById("handoff-layer");
        const wrap = document.getElementById("floor-wrap");
        layer.setAttribute("viewBox", "0 0 " + wrap.scrollWidth + " " + wrap.scrollHeight);
        layer.setAttribute("width", String(wrap.scrollWidth));
        layer.setAttribute("height", String(wrap.scrollHeight));
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        const glow = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        glow.setAttribute("class", "particle-glow");
        glow.setAttribute("r", "7");
        const core = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        core.setAttribute("class", "particle");
        core.setAttribute("r", "3.4");
        g.appendChild(glow);
        g.appendChild(core);
        layer.appendChild(g);
        particles.push({
          node: g, core: core, glow: glow,
          ax: a.x, ay: a.y, bx: b.x, by: b.y,
          start: performance.now(),
          duration: 900 + Math.random() * 400
        });
      }

      function tickParticles(now) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          const t = (now - p.start) / p.duration;
          if (t >= 1) { p.node.remove(); particles.splice(i, 1); continue; }
          const u = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          const x = p.ax + (p.bx - p.ax) * u;
          const y = p.ay + (p.by - p.ay) * u;
          p.core.setAttribute("cx", x.toFixed(2));
          p.core.setAttribute("cy", y.toFixed(2));
          p.glow.setAttribute("cx", x.toFixed(2));
          p.glow.setAttribute("cy", y.toFixed(2));
          const fade = t < 0.1 ? t / 0.1 : t > 0.85 ? (1 - t) / 0.15 : 1;
          p.node.setAttribute("opacity", String(Math.max(0, fade)));
        }
      }

      function botFromSnap(id) {
        return snapshot && snapshot.bots && snapshot.bots.find((b) => b.id === id);
      }

        openId = id;

        panel.classList.add("open");

        openId = null;
        Object.keys(seatEls).forEach((k) => seatEls[k].classList.remove("is-open"));
        const panel = document.getElementById("panel");
        panel.classList.remove("open");
        panel.classList.remove("is-owner");
        panel.setAttribute("aria-hidden", "true");
        document.body.classList.remove("panel-open");
      }

      function updateClock() {
        const now = new Date();
        const time = new Intl.DateTimeFormat(undefined, {
          weekday: "short", day: "numeric", month: "short",
          hour: "numeric", minute: "2-digit", second: "2-digit"
        }).format(now);
        const tz = new Intl.DateTimeFormat(undefined, { timeZoneName: "short" })
          .formatToParts(now)
          .find((p) => p.type === "timeZoneName");
        document.getElementById("clock").textContent = time;
        document.getElementById("tz").textContent = tz ? tz.value : "Local time";
      }

      let firstRefresh = true;
      async function refresh() {
        if (!USE_STATUS_JSON && !firstRefresh) simulateTick();
        firstRefresh = false;
        try {
          const data = await loadFleetStatus();
          applySnapshot(data);
        } catch (err) {
          console.error("Failed to load fleet status", err);
        }
      }

      function loop(now) {
        tickParticles(now);
        requestAnimationFrame(loop);
      }

      document.body.classList.toggle("is-demo", !USE_STATUS_JSON);
      document.body.classList.toggle("is-live", USE_STATUS_JSON);

      document.getElementById("p-close").addEventListener("click", (e) => {
        e.stopPropagation();
        closePanel();
      });
      document.getElementById("panel").addEventListener("click", (e) => e.stopPropagation());
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closePanel();
      });

      renderUsage();
      initSim();
      buildFloor();
      updateClock();
      setInterval(updateClock, 1000);
      refresh();
      setInterval(refresh, 3000);
      requestAnimationFrame(loop);

      const preset = new URLSearchParams(location.search).get("panel");
      if (preset && BY_ID[preset]) setTimeout(() => openPanel(preset), 80);
    })();
  </script>
</body>
</html>
